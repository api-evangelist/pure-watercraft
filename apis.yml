aid: pure-watercraft
name: Pure Watercraft
description: >-
  Pure Watercraft was a Seattle, Washington electric marine propulsion company founded in 2011 by Andy
  Rebele. It built electric outboard motors marketed as drop-in replacements for 20 to 50 horsepower gas
  engines, along with lithium-ion battery packs, chargers and Wi-Fi throttle controls, plus a consumer
  companion mobile app that pulled trip history and telemetry off the outboard over Bluetooth and pushed
  firmware updates to it. General Motors took a reported 25 percent stake in 2021. The company wound down
  and sold its assets in 2024, with the outboard line acquired by Raider Outboards and other assets going
  to a Seattle electric boat club. purewatercraft.com and the former companion-app host
  app.purewatercraft.com both now 301 to www.pureoutboards.com, the Pure Electric Outboard storefront
  operated by the acquirer. Pure Watercraft never published a public developer program, API reference,
  SDK, or machine-readable API contract; its telemetry cloud was private to its own mobile app.
